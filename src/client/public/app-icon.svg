<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Squircle container lighting -->
    <radialGradient id="iconBg" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="prismLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="prismRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="prismTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="exeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Desktop App Icon Squircle Canvas -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="4"/>
  
  <!-- Subtle inner bevel highlight -->
  <rect x="16" y="16" width="224" height="224" rx="50" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" fill="none"/>

  <!-- Orbital Multi-Agent Swarm Ring -->
  <circle cx="128" cy="128" r="84" stroke="url(#iconBorder)" stroke-width="3" stroke-dasharray="24 14 36 14" opacity="0.6"/>

  <!-- Isometric 3D Spatial Facets Core -->
  <g filter="url(#exeGlow)">
    <!-- Top Spatial Plane -->
    <polygon points="128,52 188,86 128,120 68,86" fill="url(#prismTop)" opacity="0.95" />
    
    <!-- Left Facet -->
    <polygon points="68,86 128,120 128,188 68,154" fill="url(#prismLeft)" opacity="0.9" />

    <!-- Right Facet -->
    <polygon points="128,120 188,86 188,154 128,188" fill="url(#prismRight)" opacity="0.9" />

    <!-- Central Agent Nexus Core -->
    <circle cx="128" cy="120" r="16" fill="#090a0f" stroke="#38bdf8" stroke-width="4.5" />
    <circle cx="128" cy="120" r="7" fill="#38bdf8" />

    <!-- Satellite Agent Specialist Nodes -->
    <circle cx="128" cy="66" r="8" fill="#a855f7" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="82" cy="146" r="8" fill="#06b6d4" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="174" cy="146" r="8" fill="#6366f1" stroke="#ffffff" stroke-width="2.5" />

    <!-- Neural Connectors -->
    <line x1="128" y1="76" x2="128" y2="104" stroke="#a855f7" stroke-width="3.5" stroke-dasharray="5 3"/>
    <line x1="88" y1="140" x2="114" y2="126" stroke="#06b6d4" stroke-width="3.5" stroke-dasharray="5 3"/>
    <line x1="168" y1="140" x2="142" y2="126" stroke="#6366f1" stroke-width="3.5" stroke-dasharray="5 3"/>
  </g>
</svg>
