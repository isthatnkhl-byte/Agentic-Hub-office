<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Core Ambient Lighting -->
    <radialGradient id="abstractAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#7928ca" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030307" stop-opacity="0"/>
    </radialGradient>

    <!-- Facet Gradients: Hyper-Modern Cyber Metallic -->
    <linearGradient id="monolithTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="monolithLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="monolithRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>

    <linearGradient id="laserRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>

    <!-- Laser Glow Filter -->
    <filter id="hyperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="80" cy="80" r="76" fill="url(#abstractAura)"/>

  <!-- Orbital Swarm Geometry (Outer Dynamic Hex Prisms) -->
  <polygon points="80,14 140,48 140,112 80,146 20,112 20,48" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" stroke-dasharray="12 8" fill="none"/>
  <circle cx="80" cy="80" r="68" stroke="url(#laserRim)" stroke-width="1.2" opacity="0.35" stroke-dasharray="2 16 32 16"/>

  <!-- Isometric Hyper-Monolith Facets (Forming spatial 'A' & 'H' core) -->
  <g filter="url(#hyperGlow)">
    <!-- Top Spatial Plane -->
    <polygon points="80,26 122,50 80,74 38,50" fill="url(#monolithTop)" opacity="0.95"/>
    <polygon points="80,26 122,50 80,74 38,50" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>

    <!-- Left Spatial Facet -->
    <polygon points="38,50 80,74 80,126 38,102" fill="url(#monolithLeft)" opacity="0.9"/>
    
    <!-- Right Spatial Facet -->
    <polygon points="80,74 122,50 122,102 80,126" fill="url(#monolithRight)" opacity="0.9"/>

    <!-- Center Monolith Inset (Quantum Swarm Portal) -->
    <polygon points="80,56 100,68 80,80 60,68" fill="#030307" stroke="url(#laserRim)" stroke-width="1.5"/>

    <!-- Singularity Nexus Core -->
    <circle cx="80" cy="68" r="4" fill="#00f5ff"/>
    <circle cx="80" cy="68" r="1.5" fill="#ffffff"/>

    <!-- Satellite Agent Nodes (Physical Specialist Desks) -->
    <circle cx="80" cy="34" r="3" fill="#ffffff" stroke="#00f5ff" stroke-width="1"/>
    <circle cx="114" cy="76" r="3" fill="#ffffff" stroke="#ff007a" stroke-width="1"/>
    <circle cx="46" cy="76" r="3" fill="#ffffff" stroke="#00dfa2" stroke-width="1"/>
  </g>
</svg>
